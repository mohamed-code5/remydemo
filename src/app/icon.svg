<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8a0ff" />
      <stop offset="0.45" stop-color="#7c6cff" />
      <stop offset="1" stop-color="#2ed4e8" />
    </linearGradient>
    <radialGradient id="s" cx="0.5" cy="0.12" r="0.8" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#dff7ff" />
    </linearGradient>
  </defs>

  <style>
    .bar { transform-box: fill-box; transform-origin: center; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>

  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#g)" />
  <rect x="1.5" y="1.5" width="45" height="26" rx="13" fill="url(#s)" />
  <rect x="3.75" y="3.75" width="40.5" height="40.5" rx="11.25" stroke="rgba(255,255,255,0.32)" stroke-width="1" />

  <g fill="url(#b)">
    <rect class="bar" x="11" y="16.5" width="3.6" height="15" rx="1.8" />
    <rect class="bar" x="16.6" y="11.5" width="3.6" height="25" rx="1.8" style="animation-delay:0.15s" />
    <rect class="bar" x="22.2" y="8.5" width="3.6" height="31" rx="1.8" style="animation-delay:0.3s" />
    <rect class="bar" x="27.8" y="12.5" width="3.6" height="23" rx="1.8" style="animation-delay:0.45s" />
    <rect class="bar" x="33.4" y="15.5" width="3.6" height="17" rx="1.8" style="animation-delay:0.6s" />
  </g>
</svg>
